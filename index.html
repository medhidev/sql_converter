<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/icon.png" />
    <script src="https://unpkg.com/papaparse@latest/papaparse.min.js"></script>
    <title>Convertion csv - sql</title>
</head>

<body>
    <main>
        <h1>Converter Excel to SQL</h1>

        <form>
            <p>
                <label for="excel_file">Excel file : </label><br>
                <input type="file" name="excel_file" id="excel_file" accept=".csv, .xls, .xlsx" required><br>
            </p>
            <p>
                <label for="table_name">Table name : </label><br>
                <input type="text" id="table_name" required>
            </p>
            <input type="submit" value="Generate SQL file" id="sql_generate_btn">
        </form>

        <!-- Resultat de la requête en SQL -->
        <p>
            <output>
                <textarea id="sql_area" rows="15" cols="50" disabled></textarea>
            </output>
        </p>

        <p><input type="button" value="Download" id="download_btn" hidden="true"></p>

        <script src="generate.js" async defer></script>
    </main>
</body>

</html>
